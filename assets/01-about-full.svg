onsolas, monospace" font-size="28" font-weight="600" letter-spacing="0" fill="#fff1fb">from the frontend to the APIs behind them.</text><text x="62" y="254" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" letter-spacing="0" fill="#c8c1df">Outside coding: gaming, cooking, and discovering</text><text x="62" y="287" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" letter-spacing="0" fill="#c8c1df">new things. I love challenging myself and learning</text><text x="62" y="320" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="500" letter-spacing="0" fill="#c8c1df">things I once thought were out of reach.</text><rect x="62" y="347" width="1067" height="67" fill="#242243" rx="6" stroke="#665078" stroke-width="2"/><text x="84" y="375" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="600" letter-spacing="0" fill="#f6c9e4">FONTYS HBO-ICT  |  EINDHOVEN, THE NETHERLANDS</text><text x="84" y="400" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="0" fill="#aeead6">FULL-STACK SOFTWARE  +  MACHINE LEARNING MINOR</text></svg>